<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undetect Remote Server</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #090a0f;
      --bg-surface: rgba(255, 255, 255, 0.04);
      --bg-elevated: rgba(255, 255, 255, 0.07);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
      --radius: 12px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', -apple-system, sans-serif; }
    
    ::-webkit-scrollbar { display: none; }
    body {
      background: var(--bg-base);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      overflow: hidden;
      scrollbar-width: none;
    }

    .drag-bar {
      height: 38px;
      background: rgba(15, 23, 42, 0.6);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      -webkit-app-region: drag;
    }
    .traffic-lights {
      display: flex;
      align-items: center;
      gap: 8px;
      -webkit-app-region: no-drag;
    }
    .traffic-light {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
    }
    .traffic-light.close { background: #ff5f56; }
    .traffic-light.minimize { background: #ffbd2e; }
    .traffic-light.maximize { background: #27c93f; opacity: 0.5; }
    
    .brand-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ver-tag {
      font-size: 0.7rem;
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
      padding: 2px 6px;
      border-radius: 6px;
    }

    .app-content {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
      scrollbar-width: none;
    }

    .update-banner {
      display: none;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.4);
      border-radius: var(--radius);
      padding: 12px 14px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .update-banner.show { display: flex; }

    .surface {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .surface-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .status-badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .dot-indicator {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }
    .status-badge.active { background: rgba(34, 197, 94, 0.15); color: var(--success); border: 1px solid rgba(34, 197, 94, 0.3); }
    .status-badge.active .dot-indicator { background: var(--success); box-shadow: 0 0 6px var(--success); }
    
    .status-badge.inactive { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
    .status-badge.inactive .dot-indicator { background: var(--danger); }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-label {
      font-size: 0.8rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .control {
      width: 100%;
      padding: 9px 12px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .control:focus { border-color: var(--accent); }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-elevated);
      cursor: pointer;
    }
    .toggle-input {
      width: 14px;
      height: 14px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .toggle-label {
      font-size: 0.82rem;
      color: var(--text-primary);
      cursor: pointer;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn {
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: var(--bg-elevated); color: #fff; }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.12); }
    .btn-danger { background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.3); color: var(--danger); }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.25); }

    .url-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      font-family: monospace;
      font-size: 0.78rem;
    }
    .url-text {
      overflow-wrap: anywhere;
      color: #4ade80;
    }
    .copy-btn {
      padding: 4px 8px;
      font-size: 0.72rem;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: none;
      cursor: pointer;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .icon-svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .toast {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #10b981;
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.82rem;
      opacity: 0;
      transition: 0.3s;
      pointer-events: none;
      z-index: 1000;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <!-- Drag Bar -->
  <div class="drag-bar">
    <div class="traffic-lights">
      <button class="traffic-light close" onclick="closeWindow()" title="Close"></button>
      <button class="traffic-light minimize" onclick="minimizeWindow()" title="Minimize"></button>
      <button class="traffic-light maximize" title="Maximize"></button>
    </div>
    <div class="brand-title">
      Undetect <span id="verTag" class="ver-tag">v1.0.0</span>
    </div>
    <div style="-webkit-app-region: no-drag;">
      <button class="btn btn-secondary" style="padding: 4px 8px; font-size: 0.75rem;" onclick="checkUpdates(true)" title="Check for updates">
        <svg class="icon-svg" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
        Check Updates
      </button>
    </div>
  </div>

  <div class="app-content">
    <!-- Auto-Update Notification Banner -->
    <div id="updateBanner" class="update-banner">
      <div style="font-size: 0.83rem;">
        <b>New Release Available: <span id="updateVerText">v1.0.1</span></b>
        <div style="color: var(--text-secondary); font-size: 0.75rem; margin-top: 2px;">An update is ready on GitHub.</div>
      </div>
      <button class="btn btn-primary" style="padding: 6px 12px; font-size: 0.78rem;" onclick="downloadUpdate()">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        Update Now
      </button>
    </div>

    <!-- Server Configuration Surface -->
    <div class="surface">
      <div class="surface-header">
        <span>Server Configuration</span>
        <span id="statusBadge" class="status-badge active"><span class="dot-indicator"></span> Active</span>
      </div>

      <div class="form-group">
        <label class="form-label">Access Password (PIN)</label>
        <input type="password" id="passwordInput" class="control" value="1234" placeholder="Set Passcode">
      </div>

      <div class="form-group">
        <label class="form-label">Port</label>
        <input type="number" id="portInput" class="control" value="9090" placeholder="9090">
      </div>

      <div class="btn-grid">
        <button class="btn btn-primary" onclick="updateServer()">Update & Start</button>
        <button class="btn btn-danger" onclick="stopServer()">Stop Server</button>
      </div>
    </div>

    <!-- Window Protection Surface -->
    <div class="surface">
      <div class="surface-header">Window Protection & Visibility</div>
      
      <div class="toggle-row" onclick="toggleContentProtection()">
        <input type="checkbox" id="contentProtectToggle" class="toggle-input" checked readonly>
        <label for="contentProtectToggle" class="toggle-label">Exclude App Window from Screenshots</label>
      </div>

      <div class="toggle-row" onclick="toggleTaskbar()">
        <input type="checkbox" id="taskbarToggle" class="toggle-input" readonly>
        <label for="taskbarToggle" class="toggle-label">Hide from Windows Taskbar</label>
      </div>
    </div>

    <!-- Local Network Access Surface -->
    <div class="surface">
      <div class="surface-header">Local Wi-Fi Access URLs</div>
      <div id="urlsList" style="display:flex; flex-direction:column; gap:6px;"></div>
      <div style="font-size:0.75rem; color:var(--text-secondary); margin-top:4px;">
        Shortcut: <b>Ctrl+Alt+S</b> captures primary display silently.
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="btn-grid">
      <button class="btn btn-secondary" onclick="triggerCapture()">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
        Capture Now
      </button>
      <button class="btn btn-secondary" onclick="clearSession()">
        <svg class="icon-svg" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        Clear (<span id="shotCount">0</span>)
      </button>
    </div>
  </div>

  <div id="toast" class="toast">Action completed</div>

  <script src="renderer.js"></script>
</body>
</html>
